    html {

    body {

      line-height: 1.2;

    h2 {

    }

    .mut {

    }

    .stats {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 18px

    .stat {
      text-align: center;
      padding: 14px 8px

    .stat b {
